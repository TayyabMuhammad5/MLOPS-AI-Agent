apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-inference-api
  namespace: mlops-prod
  labels:
    app: churn-inference-api
    version: v2.1.0
    component: inference-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-inference-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: churn-inference-api
        version: v2.1.0
    spec:
      containers:
        - name: churn-inference-api
          image: ghcr.io/mlops-course/churn-inference-api:v2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: churn-inference-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
